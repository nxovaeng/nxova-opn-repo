# ==============================================================================
# actions_mosdns.conf - os-mosdns native MVC service actions
# scope: configctl mosdns <action>
# Two independent services: mosdns (DNS forwarder) and pf_aliasd (pf sync).
# The old mosdns-controller / mosdns-control monolith is intentionally gone.
# ==============================================================================

# --- mosdns: regenerate config + rc toggles, align both services -----------
[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Mosdns/reconfigure.sh
parameters:
type:script
message:reconfiguring MosDNS and pf-aliasd

# --- mosdns service ----------------------------------------------------------
[start]
command:/usr/local/etc/rc.d/mosdns onestart
parameters:
type:script
message:starting MosDNS forwarder

[stop]
command:/usr/local/etc/rc.d/mosdns onestop
parameters:
type:script
message:stopping MosDNS forwarder

[restart]
command:/usr/local/etc/rc.d/mosdns onerestart
parameters:
type:script
message:restarting MosDNS forwarder

[status]
command:/usr/local/etc/rc.d/mosdns onestatus || true
parameters:
type:script_output
message:checking MosDNS forwarder status

# --- pf_aliasd service -------------------------------------------------------
[pfaliasd.start]
command:/usr/local/etc/rc.d/pf_aliasd onestart
parameters:
type:script
message:starting pf-aliasd daemon

[pfaliasd.stop]
command:/usr/local/etc/rc.d/pf_aliasd onestop
parameters:
type:script
message:stopping pf-aliasd daemon

[pfaliasd.restart]
command:/usr/local/etc/rc.d/pf_aliasd onerestart
parameters:
type:script
message:restarting pf-aliasd daemon

[pfaliasd.status]
command:/usr/local/etc/rc.d/pf_aliasd onestatus || true
parameters:
type:script_output
message:checking pf-aliasd daemon status

# --- rule files ------------------------------------------------------------
[rules.list]
command:/usr/local/opnsense/scripts/OPNsense/Mosdns/rule_tool.py list
parameters:
type:script_output
message:list mosdns rule files

[rules.get]
command:/usr/local/opnsense/scripts/OPNsense/Mosdns/rule_tool.py get
parameters:%s
type:script_output
message:get mosdns rule file

[rules.install]
command:/usr/local/opnsense/scripts/OPNsense/Mosdns/rule_tool.py install
parameters:%s %s
type:script
message:install mosdns rule file from staging

[rules.test]
command:/usr/local/opnsense/scripts/OPNsense/Mosdns/rule_tool.py test
parameters:%s
type:script_output
message:test domain against mosdns rules

[show_log]
command:/usr/bin/tail -n
parameters:%s /var/log/mosdns.log 2>/dev/null || echo "(empty)"
type:script_output
message:tail mosdns log

[show_aliasd_log]
command:/usr/bin/tail -n
parameters:%s /var/log/pf-aliasd.log 2>/dev/null || echo "(empty)"
type:script_output
message:tail pf-aliasd log
