{# Generated by os-mosdns - DO NOT EDIT MANUALLY #}
{% set _m = OPNsense.mosdns|default({}) %}
{% set general = _m.general|default({}) %}
{% set forward = _m.forward|default({}) %}
{% set pfalias = _m.pfalias|default({}) %}
{% set pfaliasd = _m.pfaliasd|default({}) %}
{% set pfalias_enabled = pfalias.enabled|default('1') == '1' %}
{% set rule_groups = helpers.toList('OPNsense.mosdns.rulegroups.group') %}
{% set remote_upstreams = forward.remote_upstreams|default('') %}
{% set local_upstreams = forward.local_upstreams|default('') %}
{% set remote_socks5 = forward.remote_socks5|default('') %}
log:
    level: info
plugins:
    - tag: forward_remote
      type: forward
      args:
        concurrent: 2
        upstreams:
{% for addr in remote_upstreams.split(',') if addr.strip() %}
            - addr: {{ addr.strip() }}
              enable_pipeline: true
{% if remote_socks5.strip() %}
              socks5: {{ remote_socks5.strip() }}
{% endif %}
{% endfor %}
    - tag: forward_local
      type: forward
      args:
        upstreams:
{% for addr in local_upstreams.split(',') if addr.strip() %}
            - addr: {{ addr.strip() }}
{% endfor %}
{# domain_set unions any number of files itself, so each enabled group's
   file is listed directly -- there is no merge step. Local groups read
   groups/<uuid>.txt, remote groups their groups/<uuid>.cache.txt. #}
    - tag: custom_direct_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'local' and g.type|default('direct') == 'direct' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.txt
{% endfor %}
    - tag: custom_proxy_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'local' and g.type|default('direct') == 'proxy' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.txt
{% endfor %}
    - tag: custom_block_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'local' and g.type|default('direct') == 'block' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.txt
{% endfor %}
    - tag: sync_direct_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'remote' and g.type|default('direct') == 'direct' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.cache.txt
{% endfor %}
    - tag: sync_proxy_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'remote' and g.type|default('direct') == 'proxy' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.cache.txt
{% endfor %}
    - tag: sync_block_domain_set
      type: domain_set
      args:
        files:
{% for g in rule_groups if g.enabled|default('1') != '0' and g.source|default('local') == 'remote' and g.type|default('direct') == 'block' %}
            - /usr/local/etc/mosdns/rule/groups/{{ g['@uuid'] }}.cache.txt
{% endfor %}
{% if pfalias_enabled %}
    - tag: sync_to_pf
      type: pf_alias
      args:
        max_ttl: {{ pfalias.max_ttl|default('86400') }}
        min_ttl: {{ pfalias.min_ttl|default('60') }}
        socket_path: {{ pfaliasd.socket_path|default('/var/run/pf-aliasd.sock') }}
        sync: {{ 'true' if pfalias.sync|default('1') == '1' else 'false' }}
        table: {{ pfalias.table|default('proxy_group') }}
        timeout: {{ pfalias.timeout|default('100ms') }}
{% endif %}
{% set mode = general.mode|default('whitelist') %}
{% set block_enabled = general.block_enabled|default('1') == '1' %}
    - tag: main_sequence
      type: sequence
      args:
        # priority: custom block > custom direct > custom proxy (pf sync) >
        #           sync block > mode over sync sets > mode default
{% if block_enabled %}
        - exec: reject 3
          matches:
            - qname $custom_block_domain_set
        - exec: return
          matches:
            - has_resp
{% endif %}
        - exec: $forward_local
          matches:
            - qname $custom_direct_domain_set
        - exec: return
          matches:
            - has_resp
        - exec: $forward_remote
          matches:
            - qname $custom_proxy_domain_set
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
        - exec: return
          matches:
            - has_resp
{% if block_enabled %}
        - exec: reject 3
          matches:
            - qname $sync_block_domain_set
        - exec: return
          matches:
            - has_resp
{% endif %}
{% if mode == 'whitelist' %}
        # whitelist: sync direct set -> local; everything else -> remote + pf sync
        - exec: $forward_local
          matches:
            - qname $sync_direct_domain_set
        - exec: return
          matches:
            - has_resp
        - exec: $forward_remote
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
{% elif mode == 'blacklist' %}
        # blacklist: sync proxy set -> remote + pf sync; everything else -> local
        - exec: $forward_remote
          matches:
            - qname $sync_proxy_domain_set
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
        - exec: return
          matches:
            - has_resp
        - exec: $forward_local
{% else %}
        # custom: sync direct -> local; sync proxy -> remote + sync; fallback per custom_default_route
        - exec: $forward_local
          matches:
            - qname $sync_direct_domain_set
        - exec: return
          matches:
            - has_resp
        - exec: $forward_remote
          matches:
            - qname $sync_proxy_domain_set
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
        - exec: return
          matches:
            - has_resp
{% set fallback = general.custom_default_route|default('proxy') %}
{% if fallback == 'direct' %}
        - exec: $forward_local
{% else %}
        - exec: $forward_remote
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
{% endif %}
{% endif %}
    - tag: udp_server
      type: udp_server
      args:
        entry: main_sequence
        listen: {{ general.listen_address|default('0.0.0.0') }}:{{ general.listen_port|default('5353') }}
    - tag: tcp_server
      type: tcp_server
      args:
        entry: main_sequence
        listen: {{ general.listen_address|default('0.0.0.0') }}:{{ general.listen_port|default('5353') }}
