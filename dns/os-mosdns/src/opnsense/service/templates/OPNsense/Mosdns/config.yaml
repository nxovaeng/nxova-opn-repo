{# Generated by os-mosdns - DO NOT EDIT MANUALLY #}
{% set general = OPNsense.mosdns.general %}
{% set forward = OPNsense.mosdns.forward %}
{% set pfalias = OPNsense.mosdns.pfalias %}
{% set pfaliasd = OPNsense.mosdns.pfaliasd %}
{% set pfalias_enabled = pfalias.enabled|default('1') == '1' %}
{% set remote_upstreams = forward.remote_upstreams|default('') %}
{% set local_upstreams = forward.local_upstreams|default('') %}
{% set direct_files = forward.direct_files|default('') %}
{% set proxy_files = forward.proxy_files|default('') %}
{% set block_files = forward.block_files|default('') %}
{% set remote_socks5 = forward.remote_socks5|default('') %}
log:
    level: info
plugins:
    - tag: forward_remote
      type: forward
      args:
        concurrent: 2
        upstreams:
{% for addr in remote_upstreams.split('\n') if addr.strip() %}
            - addr: {{ addr.strip() }}
              enable_pipeline: true
{% if remote_socks5.strip() %}
              socks5: {{ remote_socks5.strip() }}
{% endif %}
{% endfor %}
    - tag: forward_local
      type: forward
      args:
        upstreams:
{% for addr in local_upstreams.split('\n') if addr.strip() %}
            - addr: {{ addr.strip() }}
{% endfor %}
    - tag: direct_domain_set
      type: domain_set
      args:
        files:
{% for f in direct_files.split('\n') if f.strip() %}
            - {{ f.strip() }}
{% endfor %}
    - tag: proxy_domain_set
      type: domain_set
      args:
        files:
{% for f in proxy_files.split('\n') if f.strip() %}
            - {{ f.strip() }}
{% endfor %}
    - tag: block_domain_set
      type: domain_set
      args:
        files:
{% for f in block_files.split('\n') if f.strip() %}
            - {{ f.strip() }}
{% endfor %}
{% if pfalias_enabled %}
    - tag: sync_to_pf
      type: pf_alias
      args:
        max_ttl: {{ pfalias.max_ttl|default('86400') }}
        min_ttl: {{ pfalias.min_ttl|default('60') }}
        socket_path: {{ pfaliasd.socket_path|default('/var/run/pf-aliasd.sock') }}
        sync: {{ 'true' if pfalias.sync|default('1') == '1' else 'false' }}
        table: {{ pfalias.table|default('GFW_Proxy') }}
        timeout: {{ pfalias.timeout|default('100ms') }}
{% endif %}
    - tag: main_sequence
      type: sequence
      args:
        - exec: reject 3
          matches:
            - qname $block_domain_set
        - exec: return
          matches:
            - has_resp
        - exec: $forward_local
          matches:
            - qname $direct_domain_set
        - exec: return
          matches:
            - has_resp
        - exec: $forward_remote
{% if pfalias_enabled %}
        - exec: $sync_to_pf
{% endif %}
    - tag: udp_server
      type: udp_server
      args:
        entry: main_sequence
        listen: {{ general.listen_address|default('0.0.0.0') }}:{{ general.listen_port|default('5353') }}
    - tag: tcp_server
      type: tcp_server
      args:
        entry: main_sequence
        listen: {{ general.listen_address|default('0.0.0.0') }}:{{ general.listen_port|default('5353') }}
