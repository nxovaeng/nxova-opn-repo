name: Build nxova-opn-repo packages

# push 到 main (插件/daemon/构建脚本有变化) 或手动触发
on:
  push:
    branches: [main]
    paths:
      - 'dns/os-mosdns/**'
      - 'net/os-xray/**'
      - 'net/os-tun2socks/**'
      - 'daemon/pf-aliasd/**'
      - 'autobuild/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nxova-opn-repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # 只编自有代码 pf-aliasd; mosdns/tun2socks 由 build.sh 从 release 下载
      - name: Cross-compile pf-aliasd (FreeBSD)
        run: |
          mkdir -p dist/bin
          cd daemon/pf-aliasd
          GOOS=freebsd GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -o ../../dist/bin/pf-aliasd ./cmd/pf-aliasd
          cd ../..
          ls -la dist/bin
          file dist/bin/* || true

      # FreeBSD VM 里: 下载二进制 + make package + pkg repo
      - name: Package and create repo in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        env:
          PLUGIN_BUILD: ${{ github.run_number }}
        with:
          release: "15.0"
          usesh: true
          envs: 'PLUGIN_BUILD'
          prepare: |
            pkg install -y git
          run: |
            sh autobuild/build.sh

      # 发布到 gh-pages -> https://nxovaeng.github.io/nxova-opn-repo
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          cname: opnrepo.zro.qzz.io
