# ==============================================================================
# actions_tun2socks.conf - os-tun2socks native MVC service actions
# scope: configctl tun2socks <action>
# Manages the hev-socks5-tunnel tun2socks daemon. The old hev-controller
# Go web UI is intentionally gone.
# ==============================================================================

# --- tun2socks: regenerate config + rc toggle, restart service --------------
[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Tun2socks/reconfigure.sh
parameters:
type:script
message:reconfiguring tun2socks daemon

# --- tun2socks service -------------------------------------------------------
# NB: start/stop/restart use type:script so configd returns the literal 'OK'
# that ApiMutableServiceControllerBase requires (script_output would return
# the rc script's stdout, which never matches).
[start]
command:/usr/local/etc/rc.d/tun2socks onestart
parameters:
type:script
message:starting tun2socks daemon

[stop]
command:/usr/local/etc/rc.d/tun2socks onestop || true
parameters:
type:script
message:stopping tun2socks daemon

[restart]
command:/usr/local/etc/rc.d/tun2socks onerestart
parameters:
type:script
message:restarting tun2socks daemon

# NB: rc 'status' exits 1 when the service is not running; mask it so the
# base class can read 'not running' / 'is running' from the output text
# instead of configd raising CalledProcessError.
[status]
command:/usr/local/etc/rc.d/tun2socks onestatus || true
parameters:
type:script_output
message:checking tun2socks daemon status

# --- daemon log tail ---------------------------------------------------------
[log]
command:tail -n 100 /var/log/hev-socks5-tunnel.log 2>/dev/null || true
parameters:
type:script_output
message:tail tun2socks daemon log
