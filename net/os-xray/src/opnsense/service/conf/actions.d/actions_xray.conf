# ==============================================================================
# actions_xray.conf - os-xray native MVC service actions
# scope: configctl xray <action>
# Custom service xray_os (config /usr/local/etc/xray-os/config.json),
# zero conflict with the official xray-core package.
# ==============================================================================

[reconfigure]
command:/usr/local/opnsense/scripts/OPNsense/Xray/generate_config.py
parameters:
type:script
message:regenerating xray-os config

[start]
command:/usr/local/etc/rc.d/xray_os onestart
parameters:
type:script
message:starting xray-os engine

[stop]
command:/usr/local/etc/rc.d/xray_os onestop || true
parameters:
type:script
message:stopping xray-os engine

[restart]
command:/usr/local/etc/rc.d/xray_os onerestart
parameters:
type:script
message:restarting xray-os engine

[status]
command:/usr/local/etc/rc.d/xray_os onestatus || true
parameters:
type:script_output
message:checking xray-os engine status

[generate_config]
command:/usr/local/opnsense/scripts/OPNsense/Xray/generate_config.py
parameters:
type:script
message:generate xray-os config (with xray -test validation)

[preview_config]
command:/usr/local/opnsense/scripts/OPNsense/Xray/generate_config.py --preview
parameters:
type:script_output
message:preview generated xray-os config

[test_config]
command:XRAY_LOCATION_ASSET=/usr/local/share/xray-os /usr/local/bin/xray-os -test -c /usr/local/etc/xray-os/config.json >/dev/null 2>&1 && echo OK || echo FAIL
parameters:
type:script_output
message:validate xray-os config (emits only OK/FAIL: xray's own output would break the controller's exact-match check)

[test_outbound]
command:/usr/local/opnsense/scripts/OPNsense/Xray/test_outbound.py
parameters:%s
type:script_output
message:probe one site via socks inbound (live config path, 204 + latency)

[import_nodes]
command:/usr/local/opnsense/scripts/OPNsense/Xray/import_nodes.py
parameters:%s %s
type:script_output
message:parse proxy links into nodes

[fetch_subscription]
command:/usr/bin/fetch -q -o -
parameters:%s | /usr/local/opnsense/scripts/OPNsense/Xray/import_nodes.py /dev/stdin manual
type:script_output
message:fetch subscription and parse nodes

[ping_nodes]
command:/usr/local/opnsense/scripts/OPNsense/Xray/ping_nodes.py
parameters:%s
type:script_output
message:TCP ping test for nodes

[probe_node]
command:/usr/local/opnsense/scripts/OPNsense/Xray/probe_node.py
parameters:%s %s
type:script_output
message:probe single node egress IP and download speed via temp config

[show_log]
command:/usr/bin/tail -n
parameters:%s /var/log/xray-os.log 2>/dev/null || echo "(empty)"
type:script_output
message:tail xray-os log

[clear_log]
command:/usr/bin/truncate -s 0 /var/log/xray-os.log && echo OK
parameters:
type:script_output
message:truncate xray-os log (same inode, so the running daemon keeps writing to it; rm would orphan its fd)

[show_validation_error]
command:/bin/cat /usr/local/etc/xray-os/last_validation_error 2>/dev/null || echo ""
type:script_output
message:show last config validation error (empty when last generation passed)
